[pytest]
# Put the repo root on sys.path so a bare `pytest` works, not just
# `python -m pytest` (which adds the cwd itself). Without this, `pytest`
# fails to import `app` and the command in the README does not run.
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    unit: pure business-rule and guardrail tests, no LLM and no network
    integration: agent and API tests driven by a scripted provider
    eval: end-to-end scenario matrix
    live: requires a real LLM provider; deselected by default
filterwarnings =
    ignore::DeprecationWarning
