[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    unit: pure business-rule and guardrail tests, no LLM and no network
    integration: agent and API tests driven by a scripted provider
    eval: end-to-end scenario matrix
    live: requires a real LLM provider; deselected by default
filterwarnings =
    ignore::DeprecationWarning
